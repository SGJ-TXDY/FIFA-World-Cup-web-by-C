<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界杯球员库 · 注册</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --ink: #0e151e;
        --pitch: #008a60;
        --pitch-dark: #06573f;
        --red: #dd2530;
        --gold: #f5af26;
        --line: #dbe2dd;
        --muted: #626e7c;
        --field: #fafaf6;
    }

    body {
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        color: var(--ink);
        /* 球场草皮：深浅相间的条纹 + 四周压暗 */
        background:
            radial-gradient(ellipse at center, rgba(4, 7, 12, 0) 30%, rgba(4, 7, 12, 0.72) 100%),
            repeating-linear-gradient(90deg, #0a7a55 0 90px, #087050 90px 180px);
        background-color: var(--pitch-dark);
        position: relative;
    }

    /* 球场白线：中线 + 中圈 */
    body::before,
    body::after {
        content: "";
        position: absolute;
        pointer-events: none;
    }
    body::before {
        top: 0; bottom: 0; left: 50%;
        border-left: 2px solid rgba(255, 255, 255, 0.22);
    }
    body::after {
        width: 300px; height: 300px;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255, 255, 255, 0.22);
        border-radius: 50%;
    }

    .card {
        position: relative;
        z-index: 1;
        width: 400px;
        max-width: 100%;
        padding: 40px 38px 32px;
        background: #ffffff;
        border-radius: 18px;
        border-top: 5px solid var(--red);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        animation: rise 0.6s ease;
    }

    @keyframes rise {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 3px;
        color: var(--pitch);
        margin-bottom: 18px;
    }
    .brand svg { width: 28px; height: 28px; flex: none; }

    h1 {
        text-align: center;
        font-size: 26px;
        margin-bottom: 8px;
    }

    .sub {
        text-align: center;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 28px;
    }

    .field { margin-bottom: 18px; }

    .field label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
    }

    .field input {
        width: 100%;
        padding: 12px 14px;
        font-size: 14px;
        color: var(--ink);
        border: 1.5px solid var(--line);
        border-radius: 10px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        background: var(--field);
    }

    .field input:focus {
        border-color: var(--pitch);
        box-shadow: 0 0 0 4px rgba(0, 138, 96, 0.14);
        background: #fff;
    }

    button[type="submit"] {
        width: 100%;
        padding: 13px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 6px;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 8px;
        background: var(--pitch);
        box-shadow: 0 8px 20px rgba(0, 138, 96, 0.32);
        transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }

    button[type="submit"]:hover {
        background: #007652;
        transform: translateY(-2px);
        box-shadow: 0 12px 26px rgba(0, 138, 96, 0.42);
    }

    button[type="submit"]:active { transform: translateY(0); }

    .error {
        min-height: 18px;
        margin-top: 12px;
        text-align: center;
        font-size: 13px;
        color: var(--red);
    }

    .shake { animation: shake 0.35s; }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
    }

    .login-link {
        margin-top: 20px;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
    }
    .login-link a { color: var(--pitch); text-decoration: none; font-weight: 700; }
    .login-link a:hover { text-decoration: underline; }

    /* 卡片底部数据概览 */
    .stats {
        display: flex;
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px dashed var(--line);
    }
    .stats div { flex: 1; text-align: center; }
    .stats b { display: block; font-size: 20px; color: var(--ink); }
    .stats span { font-size: 12px; color: var(--muted); }
    .stats div + div { border-left: 1px solid var(--line); }
</style>
</head>
<body>
    <main class="card" id="card">
        <div class="brand">
            <svg viewBox="0 0 36 36" fill="none" aria-hidden="true">
                <circle cx="18" cy="18" r="17" fill="#008a60"/>
                <path d="M18 7L25 12L22 21H14L11 12L18 7Z" fill="#fff"/>
                <path d="M14 21L9 27M22 21L27 27M11 12L5 14M25 12L31 14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            </svg>
            世界杯球员库
        </div>
        <h1>创建账号</h1>
        <p class="sub">注册一个新账号，查询世界杯参赛球员的基础信息</p>

        <form id="registerForm" action="/register" method="post">
            <div class="field">
                <label for="username">账号</label>
                <input type="text" id="username" name="username" placeholder="请设置账号" autocomplete="username">
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请设置密码" autocomplete="new-password">
            </div>
            <div class="field">
                <label for="confirm">确认密码</label>
                <input type="password" id="confirm" placeholder="请再次输入密码" autocomplete="new-password">
            </div>
            <button type="submit">注 册</button>
            <p class="error" id="errorMsg"></p>
        </form>

        <p class="login-link">已有账号？<a href="/index.html">返回登录</a></p>

        <div class="stats">
            <div><b>48</b><span>参赛球队</span></div>
            <div><b>1254</b><span>注册球员</span></div>
            <div><b>12</b><span>小组</span></div>
        </div>
    </main>

<script>
    // 注册表单提交到服务器 /register，这里只做非空和两次密码一致性检查
    document.getElementById('registerForm').addEventListener('submit', function (e) {
        var user    = document.getElementById('username').value.trim();
        var pass    = document.getElementById('password').value.trim();
        var confirm = document.getElementById('confirm').value.trim();
        var msg     = document.getElementById('errorMsg');
        var card    = document.getElementById('card');
        var tip     = '';

        if (!user || !pass) {
            tip = '请输入账号和密码';
        } else if (pass !== confirm) {
            tip = '两次输入的密码不一致';
        }

        if (tip) {
            e.preventDefault();
            msg.textContent = tip;
            card.classList.remove('shake');
            void card.offsetWidth;   // 重新触发动画
            card.classList.add('shake');
        }
    });

    // 账号已被注册时服务器会跳回 /register.html?err=1，显示提示
    (function () {
        var qs = new URLSearchParams(location.search);
        if (qs.get('err') === '1') {
            document.getElementById('errorMsg').textContent = '该账号已被注册，请换一个试试';
        }
    })();
</script>
</body>
</html>
